<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الترمانيني | الروابط الرسمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.09);
            --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(245, 158, 11, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(234, 88, 12, 0.12) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 35px 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .brand-logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 34px;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.35);
        }

        .brand-title {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #fbbf24, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .link-btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .wa-group .icon-box { background: rgba(37, 211, 102, 0.15); color: #25d366; }
        .wa-group:hover { border-color: #25d366; }

        .fb .icon-box { background: rgba(24, 119, 242, 0.15); color: #1877f2; }
        .fb:hover { border-color: #1877f2; }

        .arrow-icon {
            color: var(--text-muted);
            font-size: 14px;
            transition: transform 0.3s ease;
        }

        .link-btn:hover .arrow-icon {
            transform: translateX(-4px);
            color: #fff;
        }

        .footer {
            margin-top: 28px;
            font-size: 12px;
            color: #64748b;
        }

        /* شاشة العلامة المائية المتحركة - ظاهرة افتراضياً فور فتح الموقع */
        .watermark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            background-image: 
                radial-gradient(circle at 50% 45%, rgba(245, 158, 11, 0.22) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        .watermark-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .wm-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gold-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            color: #fff;
            margin-bottom: 18px;
            animation: popZoom 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, pulseGlow 1.2s infinite alternate;
        }

        .wm-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #fbbf24, #f97316, #ffffff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideUp 0.6s ease forwards, shimmerText 1.4s linear infinite;
        }

        .wm-sub {
            color: #cbd5e1;
            font-size: 14px;
            margin-top: 8px;
            animation: slideUp 0.7s ease forwards;
        }

        .wm-progress {
            width: 180px;
            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            margin-top: 24px;
            overflow: hidden;
        }

        .wm-bar {
            width: 0%;
            height: 100%;
            background: var(--gold-gradient);
            border-radius: 10px;
            animation: fillBar 1.7s linear forwards;
        }

        @keyframes popZoom {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); }
            to { box-shadow: 0 0 60px rgba(234, 88, 12, 0.95); }
        }

        @keyframes shimmerText {
            to { background-position: 200% center; }
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- شاشة العلامة المائية المتحركة (تعمل فور الدخول وعند الضغط على الروابط) -->
    <div class="watermark-overlay" id="watermarkOverlay">
        <div class="wm-circle"><i class="fas fa-building"></i></div>
        <div class="wm-title">الترمانيني</div>
        <div class="wm-sub" id="wmSubText">أهلاً بكم في المنصة الرسمية</div>
        <div class="wm-progress">
            <div class="wm-bar" id="wmBar"></div>
        </div>
    </div>

    <div class="container">
        <div class="brand-logo"><i class="fas fa-building"></i></div>
        <h1 class="brand-title">الترمانيني</h1>
        <p class="brand-subtitle">المنصة الرسمية للروابط والتواصل</p>

        <div class="links-list">
            <!-- 1. مجموعة الواتس -->
            <a href="https://whatsapp.com/channel/0029VbBHzBd0QeanUy8Mhg2F" class="link-btn wa-group">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-whatsapp"></i></div>
                    <span>مجموعة الواتس</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 2. ملبوسات الترمانيني فرع 2 -->
            <a href="https://www.facebook.com/share/1BMep74ugg/" class="link-btn fb">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-facebook-f"></i></div>
                    <span>ملبوسات الترمانيني فرع 2</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 3. الترمانيني -->
            <a href="https://www.facebook.com/share/19hJbQ12aM/" class="link-btn fb">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-facebook-f"></i></div>
                    <span>الترمانيني</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 4. جوزال -->
            <a href="https://www.facebook.com/share/1DAFyzmQWS/" class="link-btn fb">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-facebook-f"></i></div>
                    <span>جوزال</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 5. مراد مود -->
            <a href="https://www.facebook.com/share/1TGga44fdh/" class="link-btn fb">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-facebook-f"></i></div>
                    <span>مراد مود</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 6. براعم الربيع -->
            <a href="https://www.facebook.com/share/1CRL1rfAHq/" class="link-btn fb">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-facebook-f"></i></div>
                    <span>براعم الربيع</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>

            <!-- 7. الترمانيني الفرع الرئيسي -->
            <a href="https://www.facebook.com/share/g/1Fc7RSsdDa/" class="link-btn fb">
                <div class="btn-content">
                    <div class="icon-box"><i class="fab fa-facebook-f"></i></div>
                    <span>الترمانيني الفرع الرئيسي</span>
                </div>
                <i class="fas fa-chevron-left arrow-icon"></i>
            </a>
        </div>

        <div class="footer">
            جميع الحقوق محفوظة © الترمانيني
        </div>
    </div>

    <script>
        const overlay = document.getElementById('watermarkOverlay');
        const subText = document.getElementById('wmSubText');
        const wmBar = document.getElementById('wmBar');
        const links = document.querySelectorAll('.link-btn');

        // إخفاء شاشة الترحيب بعد 1.8 ثانية من فتح الرابط
        setTimeout(() => {
            overlay.classList.add('hidden');
        }, 1800);

        // إعادة إظهارها عند الضغط على أي زر للانتقال
        links.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.getAttribute('href');

                subText.innerText = 'جاري توجيهك...';
                
                // إعادة تشغيل شريط التحميل من الصفر
                wmBar.style.animation = 'none';
                wmBar.offsetHeight; 
                wmBar.style.animation = 'fillBar 1.3s linear forwards';

                overlay.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1300);
            });
        });

        // إخفاء الشاشة إذا رجع الزائر بزر الرجوع
        window.addEventListener('pageshow', function(event) {
            if (event.persisted) {
                overlay.classList.add('hidden');
            }
        });
    </script>

</body>
</html>
